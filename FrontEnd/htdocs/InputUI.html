<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Segregator</title>
    <style>
        @font-face {
            font-family: 'SortXpertFont';
            src: url('https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap');
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            color: white;
        }

        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('UIimage.jpg') no-repeat center center fixed;
            background-size: cover;
            filter: blur(5px);
            z-index: -1;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            background: rgba(0, 0, 0, 0.5);
        }

        .navbar a {
            text-decoration: none;
            color: white;
            margin: 0 15px;
            font-size: 18px;
        }

        .navbar a.logo {
            font-family: 'SortXpertFont', cursive;
            font-size: 28px;
        }

        .navbar a:hover {
            text-decoration: underline;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 80vh;
            text-align: center;
        }

        .container h1 {
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        }

        .upload-box {
            width: 280px;
            height: 280px;
            border: 2px dashed white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
            background: rgba(0, 0, 0, 0.4);
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }

        .upload-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 10px;
            display: none;
        }

        .button-container {
            display: flex;
            justify-content: center; /* Centers buttons horizontally */
            align-items: center; /* Aligns them at the same level */
            gap: 20px; /* Spacing between buttons */
            margin-top: 15px;
        }



        .upload-btn, .camera-btn {
            background-color: #007bff;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            min-width: 150px; /* Ensures both buttons have equal width */
            text-align: center;
        }

        .upload-btn:hover, .camera-btn:hover {
            background-color: #0056b3;
        }

        #video {
            display: none;
            width: 300px;
            height: 300px;
            border-radius: 10px;
        }

        #canvas {
            display: none;
        }

        .result-box {
        position: absolute;
        left: 10%;  /* Moves the result to the left side */
        top: 50%;
        transform: translateY(-50%);
        background: rgba(0, 0, 0, 0.7);
        padding: 15px 20px;
        border-radius: 10px;
        font-size: 18px;
        width: 250px;
        box-shadow: 2px 2px 10px rgba(255, 255, 255, 0.2);
        text-align: left;
        display: none;
        transition: all 0.5s ease-in-out;
    }

    .result-box span {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
    }

    footer {
        text-align: center;
        padding: 10px;
        background: rgba(0, 0, 0, 0.5);
        position: fixed;
        bottom: 0;
        width: 100%;
        }

    footer p {
        margin: 0;
        color: white;
        }
    </style>
</head>
<body>
    <div class="background-container"></div>

    <div class="navbar">
        <a href="#" class="logo">SortXpert</a>
        <div>
            <a href="mainhomepage.html">Home</a>
            <a href="Mcontact.html">Contact Us</a>

        </div>
    </div>

    <div class="container">
        <h1>Waste not, Sort a lot!</h1>
        <label class="upload-box" for="imageInput">
            <p id="uploadLabel">Upload an image</p>
            <img id="uploadedImage" alt="Uploaded Image">
        </label>
        <input type="file" id="imageInput" accept="image/*" style="display: none;">
        <button class="upload-btn" onclick="processImage()">Process</button>

        <div id="resultBox" class="result-box"></div>
    </div>

    <footer>
        <p>&copy; 2025 SortXpert Team</p>
    </footer>

    <script>
        const imageInput = document.getElementById('imageInput');
        const uploadLabel = document.getElementById('uploadLabel');
        const uploadedImage = document.getElementById('uploadedImage');
        const resultBox = document.getElementById('resultBox');
    
        // ✅ Show uploaded image preview
        imageInput.addEventListener('change', function () {
            if (imageInput.files.length === 0) return;
    
            const file = imageInput.files[0];
            const reader = new FileReader();
    
            reader.onload = function (e) {
                uploadedImage.src = e.target.result;
                uploadedImage.style.display = 'block';
                uploadLabel.style.display = 'none';
            };
    
            reader.readAsDataURL(file);
        });
    
        // ✅ Process Image and Send to Backend
        function processImage() {
            if (imageInput.files.length === 0) {
                alert('⚠️ Please upload an image first!');
                return;
            }

            const file = imageInput.files[0];
            console.log("📸 Selected File:", file);

            const formData = new FormData();
            formData.append('file', file);

            // ✅ Debugging FormData
            for (let pair of formData.entries()) {
                console.log("📤 Sending FormData:", pair[0], pair[1]);
            }

            resultBox.style.display = 'none'; // Hide result box before processing

            fetch('http://127.0.0.1:8000/process', {
                method: 'POST',
                body: formData,
                headers: {
                    'Accept': 'application/json',
                    'Authorization': localStorage.getItem('authToken') || '' // ✅ ADD THIS LINE
                }
            })
            .then(response => {
                console.log("📩 Response Status:", response.status);
                return response.text();
            })
            .then(responseText => {
                console.log("🔍 Raw Response:", responseText);

                try {
                    let data = JSON.parse(responseText);
                    console.log("✅ Server Response:", data);

                    if (data.error) {
                        resultBox.innerHTML = `❌ Error: ${data.error}`;
                        resultBox.style.color = 'red';
                    } else {
                        let prediction = data.prediction || "Unknown";
                        let confidence = data.accuracy ? data.accuracy : "N/A";

                        resultBox.innerHTML = `
                            <span style="color: grey;">Prediction: ${prediction}</span><br>
                            <span style="color: white;"> Confidence: ${confidence}</span>
                            <span style="color: white;"> Precision: ${data.precision}</span><br>
                            <span style="color: white;"> Recall: ${data.recall}</span><br>
                            <span style="color: white;"> F1-Score: ${data.f1_score}</span>
                        `;
                    }
                    resultBox.style.display = 'block';
                } catch (error) {
                    console.error('❌ JSON Parsing Error:', error);
                    resultBox.innerHTML = `<span style="color: red;">❌ Unexpected error. Check console for details.</span>`;
                    resultBox.style.display = 'block';
                }
            })
            .catch(error => {
                console.error('❌ Error processing the image:', error);
                resultBox.innerHTML = `<span style="color: red;">❌ Unexpected error. Please try again.</span>`;
                resultBox.style.display = 'block';
            });
        }

    </script>
    
</body>
</html>
