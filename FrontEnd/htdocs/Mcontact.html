<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - SortXpert</title>
    <style>
        /* General Page Styles */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #003366, #00aaff);
            color: #ffffff;
            text-align: center;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            background: #002a5e;
            color: white;
            padding: 15px;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
            justify-content: center;
            position: relative;
        }

        /* SortXpert Text Logo */
        .logo {
            position: absolute;
            left: 15px;
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
            text-decoration: none;
            font-family: 'Arial', sans-serif;
        }

        .logo:hover {
            text-decoration: underline;
        }

        /* Contact Card */
        .contact-container {
            width: 60%;
            background: rgba(255, 255, 255, 0.92);
            padding: 30px;
            margin: 50px auto;
            border-radius: 12px;
            box-shadow: 0px 5px 20px rgba(0, 0, 0, 0.3);
            color: #002a5e;
        }

        .contact-container h2 {
            margin-bottom: 15px;
            color: #002a5e;
        }

        .contact-container a {
            color: #0077cc;
            font-weight: bold;
            text-decoration: none;
        }

        .contact-container a:hover {
            text-decoration: underline;
        }

        /* Support Buttons */
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .button {
            background-color: #0077cc;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .button:hover {
            background-color: #005999;
        }

        /* Footer */
        .footer {
            margin-top: 30px;
            font-size: 14px;
            color: #ffffff;
            background: #002a5e;
            padding: 10px;
        }
    </style>
</head>
<body>

    <!-- Header with SortXpert Text Logo -->
    <div class="header">
        <a href="mainhomepage.html" class="logo">SortXpert</a>
        Contact Us
    </div>

    <div class="contact-container">
        <h2>Hi, [User]! Need Help?</h2>
        <p>Our team is here to assist you. Choose an option below:</p>

        <div class="buttons">
            <button class="button" onclick="window.location.href='mailto:support@sortxpert.com'">Email Support</button>
            <button class="button" onclick="alert('Live Chat Coming Soon!')">Live Chat</button>
            
        </div>

        <h3>Follow Us</h3>
        <p>
            <a href="https://www.linkedin.com/in/sortxpert" target="_blank">LinkedIn</a> |
            <a href="https://twitter.com/sortxpert" target="_blank">Twitter</a>
        </p>
    </div>

    <div class="footer">
        <p>&copy; 2025 SortXpert. All rights reserved.</p>
    </div>

</body>
</html>
