<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - SortXpert</title>
    <style>
        /* General Page Styles */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f5f5;
            color: #333;
            text-align: center;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            background-color: #4a4a4a;
            color: white;
            padding: 15px;
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 1px;
            justify-content: center;
            position: relative;
        }

        /* SortXpert Text Logo */
        .logo {
            position: absolute;
            left: 15px;
            font-size: 24px;
            font-weight: bold;
            color: #ff8c00;
            text-decoration: none;
            font-family: 'Arial', sans-serif;
        }

        .logo:hover {
            text-decoration: underline;
        }

        /* Contact Card */
        .contact-container {
            width: 50%;
            background: white;
            padding: 25px;
            margin: 50px auto;
            border-radius: 12px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.2);
        }

        .contact-container h2 {
            margin-bottom: 15px;
            color: #ff8c00;
        }

        .contact-container a {
            color: #0077cc;
            font-weight: bold;
            text-decoration: none;
        }

        .contact-container a:hover {
            text-decoration: underline;
        }

        /* Footer */
        .footer {
            margin-top: 30px;
            font-size: 14px;
            color: #777;
        }
    </style>
</head>
<body>

    <!-- Header with SortXpert Text Logo -->
    <div class="header">
        <a href="homepage.html" class="logo">SortXpert</a>
        Contact Us
    </div>

    <div class="contact-container">
        <h2>Get in Touch</h2>
        <p>If you have any queries or issues, feel free to contact us:</p>
        
        <p><strong>Email:</strong> <a href="mailto:support@sortxpert.com">support@sortxpert.com</a></p>
        <p><strong>Phone:</strong> +91-XXXXXXXXXX</p>

        <h3>Follow Us</h3>
        <p>
            <a href="https://www.linkedin.com/in/sortxpert" target="_blank">LinkedIn</a> |
            <a href="https://twitter.com/sortxpert" target="_blank">Twitter</a>
        </p>
    </div>

    <div class="footer">
        <p>&copy; 2025 SortXpert. All rights reserved.</p>
    </div>

</body>
</html>
